<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Boop!</title>
    <meta name="description" content="Boop!">
    <meta name="viewport" content= "width=device-width, user-scalable=no">
    <style>
        body, html {
            align-items: center;
            background: #333;
            display: flex;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 0;
            width: 100vw;
        }
        #container {
            position: relative;
        }
        #doggo {
            aspect-ratio: 3/4;
            height: 100%;
            max-height: 100vh;
            max-width: 100vw;
        }
        #snoot {
            left: 21.6146%;
            position: absolute;
            top: 27.1973%;
            z-index: 4;
            width: auto;
            
            &:active {
                transform: scale(1.05);
            }
        }
        #boops {
            bottom: 5px;
            color: #1ed7ff;
            font-size: 5rem;
            position: absolute;
            right: 5px;
            text-shadow: 5px 5px 5px #333;
        }
    </style>
    <script>
        let boops = 0;
        if (localStorage) {
            const storedBoops = localStorage.getItem("boops");
            if (storedBoops) {
                boops = Number(storedBoops);
            }
        }
        const doggoCalculation = () => {
            const doggo = document.getElementById('doggo');
            const snoot = document.getElementById('snoot');
            const ratio = doggo.naturalHeight / doggo.clientHeight;
            snoot.height = snoot.naturalHeight / ratio;
        };
        const placeBoops = () => {
            const boopsHolder = document.getElementById('boops');
            if (boopsHolder) {
                boopsHolder.innerText = boops;
            }
        }
        window.addEventListener('resize', doggoCalculation);
        window.addEventListener('load', () => {
            doggoCalculation();
            placeBoops();
            const snoot = document.getElementById('snoot');
            snoot.addEventListener('click', () => {
                const audio = document.createElement("audio");
                audio.src = "boop.mp3";
                audio.play().catch();
                localStorage.setItem("boops", (++boops).toString());
                placeBoops();
            });
        });
    </script>
</head>
<body>
    <div id="container">
        <img alt="" id="doggo" src="doggo.jpg" />
        <img alt="" id="snoot" src="snoot.png" />
        <div id="boops">0</div>
    </div>
</body>
</html>
