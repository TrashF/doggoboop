<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Boop!</title>
    <meta name="description" content="Boop!">
    <meta name="viewport" content= "width=device-width, user-scalable=no">
    <style>
        body, html {
            align-items: center;
            background: #333;
            display: flex;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 0;
            width: 100vw;
        }
        #container {
            position: relative;
        }
        #doggo {
            aspect-ratio: 3/4;
            height: 100%;
            max-height: 100vh;
            max-width: 100vw;
        }
        #snoot {
            left: 21.6146%;
            position: absolute;
            top: 27.1973%;
            z-index: 4;
            width: auto;
            
            &:active {
                transform: scale(1.05);
            }
        }
    </style>
    <script>
        const doggoCalculation = () => {
            const doggo = document.getElementById('doggo');
            const snoot = document.getElementById('snoot');
            const ratio = doggo.naturalHeight / doggo.clientHeight;
            snoot.height = snoot.naturalHeight / ratio;
        };
        window.addEventListener('resize', doggoCalculation);
        window.addEventListener('load', () => {
            doggoCalculation();
            const snoot = document.getElementById('snoot');
            snoot.addEventListener('click', () => {
                const audio = document.createElement("audio");
                audio.src = "boop.mp3";
                audio.play().catch();
            });
        });
    </script>
</head>
<body>
    <div id="container">
        <img alt="" id="doggo" src="doggo.jpg" />
        <img alt="" id="snoot" src="snoot.png" />
    </div>
</body>
</html>
